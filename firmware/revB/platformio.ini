; PlatformIO Project Configuration File
;
; Hardware test suite for STM32F411 Tide Display
; Custom PCB without external crystal - uses HSI

[platformio]
default_envs = hal

[env:arduino]
platform = ststm32
board = genericSTM32F411CE
framework = arduino
upload_protocol = stlink
debug_tool = stlink

; Use internal oscillator (no external crystal)
; Force HSI clock source instead of HSE
build_flags =
    -D HSE_VALUE=0
    -D ARDUINO_GENERIC_F411CEUX
build_unflags = -DHSE_VALUE=25000000

; GxEPD2 library for e-paper
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit BusIO@^1.14.0

; HAL environment
[env:hal]
platform = ststm32
board = genericSTM32F411CE
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags =
    -D HSE_VALUE=0
    -Wl,-u,_printf_float
    -Wl,-lm
build_unflags = -DHSE_VALUE=25000000

; u8g2 source files are in lib/u8g2/
