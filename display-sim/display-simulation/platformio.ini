; PlatformIO configuration for STM32 Tide Display
;
; Build for STM32F411 BlackPill with WeAct 2.9" e-paper display
;
; Usage:
;   pio run              - Build
;   pio run -t upload    - Upload to device
;   pio device monitor   - Serial monitor

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino

; Libraries
lib_deps =
    olikraus/U8g2@^2.35.9
    adafruit/RTClib@^2.1.1

; Build flags
build_flags =
    -D STM32_BUILD
    -D U8X8_WITH_USER_PTR

; Source files - exclude PC simulation backend
build_src_filter =
    +<*>
    -<display_sim.c>

; Upload settings (using ST-Link)
upload_protocol = stlink

; Monitor settings
monitor_speed = 115200
